name: document-intelligence

services:
  api:
    build:
      context: .
      target: runtime
    init: true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      PGHOST: db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DOCUMENT_STORAGE_PATH: /data/documents
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-document_intelligence}
      PGUSER: ${POSTGRES_USER:-document_intelligence}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copier .env.example vers .env}
    volumes:
      - ./app:/workspace/app:ro
      - ./alembic.ini:/workspace/alembic.ini:ro
      - ./migrations:/workspace/migrations:ro
      - document_files:/data/documents
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-document_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-document_intelligence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copier .env.example vers .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  document_files:
