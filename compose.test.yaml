name: document-intelligence-tests

services:
  db-test:
    build:
      context: ./docker
      dockerfile: postgres.Dockerfile
    environment:
      POSTGRES_DB: document_intelligence_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d document_intelligence_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  tests:
    command: >-
      sh -c 'alembic upgrade head && alembic check &&
      python -m pytest -q -p no:cacheprovider &&
      alembic downgrade base && alembic upgrade head && alembic check'
    build:
      context: ./backend
      target: test
    environment:
      PGHOST: db-test
      PGPORT: "5432"
      PGDATABASE: document_intelligence_test
      PGUSER: test
      PGPASSWORD: test_only
    depends_on:
      db-test:
        condition: service_healthy
